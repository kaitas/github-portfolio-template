<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>わたしのポートフォリオ</title>
<meta name="description" content="作品ポートフォリオ">
<!-- SNSでシェアされたときの見え方。画像はあとで差し替えてください -->
<meta property="og:title" content="わたしのポートフォリオ">
<meta property="og:type" content="website">
<meta property="og:image" content="http://akihiko.shirai.as/github-portfolio-template/images/HakaseOG.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <!-- ▼ ここから書き換えます -->
  <p class="course">Portfolio</p>
  <h1>あなたの名前</h1>
  <p class="bio">
    ひとことで自己紹介を書きます。何をつくる人か、何に興味があるかを2〜3行で。
  </p>
  <!-- ▲ ここまで -->
</header>

<main>
  <section>
    <h2>作品</h2>
    <div class="works">

      <!--
        作品を1つ増やすときは、この <figure> ... </figure> を
        まるごとコピーして貼り付け、中身を書き換えてください。
        画像は images/ フォルダに入れます。
      -->
      <figure class="work">
        <!-- 画像が無い間は、枠だけのプレースホルダが出ます（onerror）。
             images/ に画像を置いて src を差し替えたら、この属性は消してOK -->
        <img src="images/work-01.png" alt="作品1の説明"
          onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; viewBox=&quot;0 0 800 450&quot;><rect width=&quot;800&quot; height=&quot;450&quot; fill=&quot;%23f0f0f2&quot;/><rect x=&quot;8&quot; y=&quot;8&quot; width=&quot;784&quot; height=&quot;434&quot; fill=&quot;none&quot; stroke=&quot;%23c8c8d0&quot; stroke-width=&quot;3&quot; stroke-dasharray=&quot;12 8&quot;/><text x=&quot;400&quot; y=&quot;215&quot; text-anchor=&quot;middle&quot; font-family=&quot;sans-serif&quot; font-size=&quot;28&quot; fill=&quot;%23707078&quot;>images/ に作品画像を入れると</text><text x=&quot;400&quot; y=&quot;255&quot; text-anchor=&quot;middle&quot; font-family=&quot;sans-serif&quot; font-size=&quot;28&quot; fill=&quot;%23707078&quot;>ここに表示されます</text></svg>')">
        <figcaption>
          <h3>作品のタイトル</h3>
          <p class="meta">2026</p>
          <p>この作品で何を表現したかったか、どう作ったかを書きます。</p>
          <details>
            <summary>使ったプロンプト</summary>
            <pre>ここにプロンプトを貼ります</pre>
          </details>
        </figcaption>
      </figure>

    </div>
  </section>
</main>

<footer>
  <p>Your Name</p>
  <p class="note">
    このページの画像は生成AIを用いて制作しています。
    使用したツールとプロンプトは各作品に記載しています。
  </p>
</footer>

</body>
</html>
