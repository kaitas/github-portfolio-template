# GitHub Pages へ公開する。
#
# このリポジトリを使う人はエンジニアではない前提。
# したがって「何もしなくても公開される」ことを最優先にしている。
# ファイルを編集して保存（コミット）すれば、1〜2分で公開URLに反映される。
#
# ビルドは行わない。index.html をそのまま配る。
# ビルドを挟むと、失敗したときに原因が分からず手が止まる。

name: pages

on:
  push:
    branches: [main]
  # 手動でも実行できるようにしておく（うまく出ないときの再実行用）
  workflow_dispatch:
    inputs:
      ref:
        description: 公開するブランチ（通常はmain）
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。連続で保存したとき、古い方が後から上書きするのを防ぐ。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: リポジトリ情報を確認
        env:
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          if [ "$OWNER_TYPE" = "Organization" ]; then
            location="Organization ${OWNER}"
          else
            location="個人アカウント ${OWNER}"
          fi
          {
            echo "## 公開先"
            echo "- 所有者: ${location}"
            echo "- 公開URL: https://${OWNER}.github.io/${REPOSITORY}/"
          } >> "$GITHUB_STEP_SUMMARY"

      # 提出前に気づけるよう、最低限だけ確かめる。
      # 「公開されたが中身が空」を防ぐのが目的で、書き方の指導はしない。
      - name: 最低限の確認
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          test -f index.html || { echo "::error::index.html がありません"; exit 1; }
          if [ "$IS_TEMPLATE" != "true" ] && grep -q "あなたの名前" index.html; then
            echo "::warning::index.html がテンプレートのままです（「あなたの名前」が残っています）"
          fi
          n=$(find images -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' \) | wc -l)
          echo "作品画像: ${n} 枚"
          if [ "$n" -eq 0 ]; then
            echo "::warning::images/ に画像がありません。作品を入れてください"
          fi
          missing=0
          while IFS= read -r image; do
            if [ ! -f "$image" ]; then
              echo "::warning file=index.html::画像 $image が見つかりません。ファイル名と大文字・小文字を確認してください"
              missing=1
            fi
          done < <(grep -oE '(src|content)="images/[^"]+"' index.html | cut -d'"' -f2 | sort -u)
          if [ "$missing" -eq 1 ]; then
            echo "画像の参照に警告があります（公開は続行します）"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
